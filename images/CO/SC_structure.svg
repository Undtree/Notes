<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc" font-family="Times New Roman, Times, Liberation Serif, Noto Serif, serif">
<title id="title">存储芯片的结构</title>
<desc id="desc">双译码存储芯片。A0 至 A5 经地址寄存器、X 译码器和驱动器选择行；A6 至 A11 经地址寄存器和 Y 译码器选择列。八个位平面各含 64×64 个存储元。I/O 电路连接存储矩阵、输出驱动和控制电路；WE 与 CS 为低电平有效。</desc>
