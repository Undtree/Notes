<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc" font-family="Times New Roman, Times, Liberation Serif, Noto Serif, serif">
<title id="title">带标志加法器与标志生成电路</title>
<desc id="desc">C0 等于 Sub，B′ 为经过加减选择的第二操作数。CF = Cn 异或 Sub；OF = Cn 异或 C(n−1)；SF = F(n−1)；ZF 为结果全部 n 位的或非。</desc>
<!-- 复习指导 图 2.6；位编号统一从 0 开始，寄存器名称与正文一致。 -->
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4051b5"/></marker>
<marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d62728"/></marker>
</defs>
<rect width="1240" height="600" fill="#ffffff"/>
<text x="620" y="40" text-anchor="middle" font-size="21" fill="#1a237e" font-weight="700"><tspan font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif">带标志加法器：</tspan>C<tspan font-size="14.7" dy="4">0</tspan><tspan dy="-4"> = Sub</tspan></text>
<path d="M 140 210 L 500 255 V 405 L 140 450 V 351.6 L 165 330.0 L 140 308.4 Z" fill="#eaf0ff" stroke="#4051b5" stroke-width="2" stroke-linejoin="round"/>
<text x="338.0" y="336.0" text-anchor="middle" font-size="21" fill="#1a237e" font-weight="700">n <tspan font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif">位加法器</tspan></text>
<text x="335" y="370" text-anchor="middle" font-size="18" fill="#1a237e">F = A + B′ + C<tspan font-size="12.6" dy="4">0</tspan></text>
<path d="M 50 265 H 140" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="65" y="246" text-anchor="middle" font-size="18" fill="#1a237e">A</text>
<path d="M 99 271 L 111 259" fill="none" stroke="#4051b5" stroke-width="2" stroke-linejoin="round"/>
<text x="105" y="255" text-anchor="middle" font-size="15" fill="#1a237e">n</text>
<path d="M 50 385 H 140" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="65" y="365" text-anchor="middle" font-size="18" fill="#1a237e">B′</text>
<path d="M 99 391 L 111 379" fill="none" stroke="#4051b5" stroke-width="2" stroke-linejoin="round"/>
<text x="105" y="375" text-anchor="middle" font-size="15" fill="#1a237e">n</text>
<path d="M 320 100 V 232.5" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="300" y="86" text-anchor="middle" font-size="18" fill="#1a237e">Sub = C<tspan font-size="12.6" dy="4">0</tspan></text>
<path d="M 320 130 H 642 A 8 8 0 0 1 658 130 H 700 V 120 H 795.5" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round"/>
<circle cx="320" cy="130" r="4" fill="#4051b5"/>
<text x="610" y="119" text-anchor="middle" font-size="16" fill="#1a237e">Sub</text>
<path d="M 420 245 H 650 V 90 H 795.5" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round"/>
<text x="542" y="232" text-anchor="middle" font-size="17" fill="#1a237e">C<tspan font-size="11.9" dy="4">n</tspan></text>
<path d="M 650 245 H 795.5" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round"/>
<circle cx="650" cy="245" r="4" fill="#4051b5"/>
<path d="M 500 285 H 760 V 215 H 795.5" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round"/>
<text x="550" y="275" text-anchor="middle" font-size="17" fill="#1a237e">C<tspan font-size="11.9" dy="4">n−1</tspan></text>
<path d="M 800 75 Q 820 105 800 135 C 830 129 865 120 885 105 C 865 90 830 81 800 75 Z" fill="#eaf0ff" stroke="#4051b5" stroke-width="2" stroke-linejoin="round"/>
<path d="M 788 75 Q 808 105 788 135" fill="none" stroke="#4051b5" stroke-width="2" stroke-linejoin="round"/>
<path d="M 800 200 Q 820 230 800 260 C 830 254 865 245 885 230 C 865 215 830 206 800 200 Z" fill="#eaf0ff" stroke="#4051b5" stroke-width="2" stroke-linejoin="round"/>
<path d="M 788 200 Q 808 230 788 260" fill="none" stroke="#4051b5" stroke-width="2" stroke-linejoin="round"/>
<path d="M 885 105 H 1100" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1130" y="112" text-anchor="middle" font-size="21" fill="#1a237e" font-weight="700">CF</text>
<path d="M 885 230 H 1100" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1130" y="237" text-anchor="middle" font-size="21" fill="#1a237e" font-weight="700">OF</text>
<path d="M 500 390 H 570 V 490 H 1100" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 684 496 L 696 484" fill="none" stroke="#4051b5" stroke-width="2" stroke-linejoin="round"/>
<text x="690" y="480" text-anchor="middle" font-size="15" fill="#1a237e">n</text>
<text x="1130" y="497" text-anchor="middle" font-size="21" fill="#1a237e" font-weight="700">F</text>
<path d="M 570 350 H 1100" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="570" cy="350" r="4" fill="#4051b5"/>
<text x="700" y="338" text-anchor="middle" font-size="16" fill="#1a237e">F<tspan font-size="11.2" dy="4">n−1</tspan><tspan dy="-4"><tspan font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif">（取最高位）</tspan></tspan></text>
<text x="1130" y="357" text-anchor="middle" font-size="21" fill="#1a237e" font-weight="700">SF</text>
<path d="M 570 390 V 350" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round"/>
<circle cx="570" cy="390" r="4" fill="#4051b5"/>
<path d="M 570 430 H 730" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round"/>
<circle cx="570" cy="430" r="4" fill="#4051b5"/>
<path d="M 659 436 L 671 424" fill="none" stroke="#4051b5" stroke-width="2" stroke-linejoin="round"/>
<text x="665" y="420" text-anchor="middle" font-size="15" fill="#1a237e">n</text>
<path d="M 740 380 H 730 V 460 H 740" fill="none" stroke="#4051b5" stroke-width="1.5" stroke-linejoin="round"/>
<text x="710" y="408" text-anchor="end" font-size="15" fill="#1a237e">F<tspan font-size="10.5" dy="4">n−1:0</tspan></text>
<path d="M 800 390 Q 820 420 800 450 C 830 444 865 435 885 420 C 865 405 830 396 800 390 Z" fill="#eaf0ff" stroke="#4051b5" stroke-width="2" stroke-linejoin="round"/>
<circle cx="891" cy="420" r="6" fill="#ffffff" stroke="#4051b5" stroke-width="2"/>
<path d="M 740 395 H 803.1" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round"/>
<path d="M 740 445 H 803.1" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round"/>
<circle cx="773" cy="414" r="1.7" fill="#1a237e"/>
<circle cx="773" cy="420" r="1.7" fill="#1a237e"/>
<circle cx="773" cy="426" r="1.7" fill="#1a237e"/>
<text x="850" y="468" text-anchor="middle" font-size="16" fill="#1a237e">n <tspan font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif">输入或非门</tspan></text>
<path d="M 897 420 H 1100" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1130" y="427" text-anchor="middle" font-size="21" fill="#1a237e" font-weight="700">ZF</text>
<text x="620" y="565" text-anchor="middle" font-size="17" fill="#1a237e">B′ <tspan font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif">的选择电路见</tspan>“<tspan font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif">统一的加减运算电路</tspan>”<tspan font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif">；所有标志均由同一次加减运算产生。</tspan></text>
</svg>
