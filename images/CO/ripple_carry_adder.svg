<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-labelledby="title desc" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif">
<title id="title">四位串行进位加法器</title>
<desc id="desc">四个全加器首尾串联构成 4 位加法器：最低位 FA0 的输入进位为 C0，每一级的进位输出 C_{i+1} 直接作为相邻高位的进位输入。各级本位和 S_i 可并行输出，但进位必须从低位到高位逐级串行传递（图中红色路径），位数越多延迟越长。</desc>

<defs>
  <!-- 箭头头部 -->
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4051b5"/>
  </marker>
  <!-- 红色箭头头部（进位路径） -->
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#d62728"/>
  </marker>
</defs>

<!-- 背景 -->
<rect width="1200" height="390" fill="#ffffff"/>

<!-- ============ 四个全加器 ============ -->
<rect x="140" y="150" width="150" height="140" rx="12" fill="#eaf0ff" stroke="#4051b5" stroke-width="2"/>
<text x="215" y="224" text-anchor="middle" font-size="20" font-weight="700" fill="#283593">FA<tspan font-size="13" dy="4">0</tspan></text>
<text x="215" y="254" text-anchor="middle" font-size="13" fill="#4051b5">全加器</text>

<rect x="380" y="150" width="150" height="140" rx="12" fill="#eaf0ff" stroke="#4051b5" stroke-width="2"/>
<text x="455" y="224" text-anchor="middle" font-size="20" font-weight="700" fill="#283593">FA<tspan font-size="13" dy="4">1</tspan></text>
<text x="455" y="254" text-anchor="middle" font-size="13" fill="#4051b5">全加器</text>

<rect x="620" y="150" width="150" height="140" rx="12" fill="#eaf0ff" stroke="#4051b5" stroke-width="2"/>
<text x="695" y="224" text-anchor="middle" font-size="20" font-weight="700" fill="#283593">FA<tspan font-size="13" dy="4">2</tspan></text>
<text x="695" y="254" text-anchor="middle" font-size="13" fill="#4051b5">全加器</text>

<rect x="860" y="150" width="150" height="140" rx="12" fill="#eaf0ff" stroke="#4051b5" stroke-width="2"/>
<text x="935" y="224" text-anchor="middle" font-size="20" font-weight="700" fill="#283593">FA<tspan font-size="13" dy="4">3</tspan></text>
<text x="935" y="254" text-anchor="middle" font-size="13" fill="#4051b5">全加器</text>

<!-- ============ 数据输入 A_i、B_i ============ -->
<line x1="175" y1="88" x2="175" y2="146" stroke="#4051b5" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="175" y="76" text-anchor="middle" font-size="15" fill="#1a237e">A<tspan font-size="11" dy="4">0</tspan></text>
<line x1="255" y1="88" x2="255" y2="146" stroke="#4051b5" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="255" y="76" text-anchor="middle" font-size="15" fill="#1a237e">B<tspan font-size="11" dy="4">0</tspan></text>

<line x1="415" y1="88" x2="415" y2="146" stroke="#4051b5" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="415" y="76" text-anchor="middle" font-size="15" fill="#1a237e">A<tspan font-size="11" dy="4">1</tspan></text>
<line x1="495" y1="88" x2="495" y2="146" stroke="#4051b5" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="495" y="76" text-anchor="middle" font-size="15" fill="#1a237e">B<tspan font-size="11" dy="4">1</tspan></text>

<line x1="655" y1="88" x2="655" y2="146" stroke="#4051b5" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="655" y="76" text-anchor="middle" font-size="15" fill="#1a237e">A<tspan font-size="11" dy="4">2</tspan></text>
<line x1="735" y1="88" x2="735" y2="146" stroke="#4051b5" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="735" y="76" text-anchor="middle" font-size="15" fill="#1a237e">B<tspan font-size="11" dy="4">2</tspan></text>

<line x1="895" y1="88" x2="895" y2="146" stroke="#4051b5" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="895" y="76" text-anchor="middle" font-size="15" fill="#1a237e">A<tspan font-size="11" dy="4">3</tspan></text>
<line x1="975" y1="88" x2="975" y2="146" stroke="#4051b5" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="975" y="76" text-anchor="middle" font-size="15" fill="#1a237e">B<tspan font-size="11" dy="4">3</tspan></text>

<!-- ============ 本位和输出 S_i ============ -->
<line x1="215" y1="294" x2="215" y2="344" stroke="#4051b5" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="215" y="364" text-anchor="middle" font-size="15" fill="#1a237e">S<tspan font-size="11" dy="4">0</tspan></text>

<line x1="455" y1="294" x2="455" y2="344" stroke="#4051b5" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="455" y="364" text-anchor="middle" font-size="15" fill="#1a237e">S<tspan font-size="11" dy="4">1</tspan></text>

<line x1="695" y1="294" x2="695" y2="344" stroke="#4051b5" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="695" y="364" text-anchor="middle" font-size="15" fill="#1a237e">S<tspan font-size="11" dy="4">2</tspan></text>

<line x1="935" y1="294" x2="935" y2="344" stroke="#4051b5" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="935" y="364" text-anchor="middle" font-size="15" fill="#1a237e">S<tspan font-size="11" dy="4">3</tspan></text>

<!-- ============ 进位链（红色：串行传递） ============ -->
<line x1="50" y1="220" x2="136" y2="220" stroke="#d62728" stroke-width="3.5" marker-end="url(#arrowRed)"/>
<text x="93" y="208" text-anchor="middle" font-size="15" fill="#d62728">C<tspan font-size="11" dy="4">0</tspan></text>

<line x1="290" y1="220" x2="376" y2="220" stroke="#d62728" stroke-width="3.5" marker-end="url(#arrowRed)"/>
<text x="333" y="208" text-anchor="middle" font-size="15" fill="#d62728">C<tspan font-size="11" dy="4">1</tspan></text>

<line x1="530" y1="220" x2="616" y2="220" stroke="#d62728" stroke-width="3.5" marker-end="url(#arrowRed)"/>
<text x="573" y="208" text-anchor="middle" font-size="15" fill="#d62728">C<tspan font-size="11" dy="4">2</tspan></text>

<line x1="770" y1="220" x2="856" y2="220" stroke="#d62728" stroke-width="3.5" marker-end="url(#arrowRed)"/>
<text x="813" y="208" text-anchor="middle" font-size="15" fill="#d62728">C<tspan font-size="11" dy="4">3</tspan></text>

<line x1="1010" y1="220" x2="1096" y2="220" stroke="#d62728" stroke-width="3.5" marker-end="url(#arrowRed)"/>
<text x="1053" y="208" text-anchor="middle" font-size="15" fill="#d62728">C<tspan font-size="11" dy="4">4</tspan></text>

</svg>
