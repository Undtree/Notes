<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc" font-family="Times New Roman, Times, Liberation Serif, Noto Serif, serif">
<title id="title">四位串行进位加法器</title>
<desc id="desc">从右向左依次为第 0、1、2、3 位。C0 输入最低位，C1 至 C4 逐级传递。各位和需等各自进位输入稳定后才能确定。</desc>
