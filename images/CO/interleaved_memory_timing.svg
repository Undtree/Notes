<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc" font-family="Times New Roman, Times, Liberation Serif, Noto Serif, serif">
<title id="title">低位交叉轮流启动的存取时间示意图</title><desc id="desc">四体低位交叉，存储周期 T 等于 4τ。各字访问相隔 τ 启动，单次访问历时 T。第 4τ 时 M0 再次启动，完成结果相隔 τ 到达。</desc>
