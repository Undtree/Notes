<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1010" viewBox="0 0 1120 1010" role="img" aria-labelledby="title desc" font-family="Times New Roman, Times, Liberation Serif, Noto Serif, serif">
<title id="title">字扩展</title>
<desc id="desc">4 片 16K×8 位芯片组成 64K×8 位存储器。A13 至 A0 共 14 根地址线及 WE 接所有芯片。A15、A14 通过低电平有效的 2—4 译码器，在 00、01、10、11 时分别选中第 0、1、2、3 片。各片共用 D7 至 D0，同一时刻只选中一片。 实心点表示连接，跨线弧表示不连接。</desc>
<!-- 与 storage.md 中的扩展示例一致；地址线使用总线表示，WE、CS 及译码器片选输出均为低电平有效。 -->
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4051b5"/></marker>
<marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d62728"/></marker>
</defs>
<rect width="1120" height="1010" fill="#ffffff"/>
<text x="560" y="38" text-anchor="middle" font-size="25" fill="#1a237e" font-weight="700"><tspan font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif">字扩展</tspan></text>
<text x="560" y="78" text-anchor="middle" font-size="24" fill="#1a237e" font-weight="400">4 <tspan font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif">片</tspan> 16K × 8 <tspan font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif">位芯片</tspan> → 64K × 8 <tspan font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif">位存储器</tspan></text>
