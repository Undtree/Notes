<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc" font-family="Times New Roman, Times, Liberation Serif, Noto Serif, serif">
<title id="title">四位全先行进位加法器</title>
<desc id="desc">每位的 Gi 和 Pi 送入 CLA；CLA 根据全部 G、P 与 C0 产生 C1、C2、C3、C4。C1 至 C3 分别送入对应高位 FA，各 FA 之间没有串行进位连线。</desc>
<!-- 复习指导 图 2.5；位编号统一从 0 开始，寄存器名称与正文一致。 -->
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4051b5"/></marker>
<marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d62728"/></marker>
</defs>
