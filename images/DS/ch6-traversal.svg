<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="150" viewBox="0 0 320 150">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4051b5"/>
    </marker>
  </defs>

  <!-- 有向边：1 → 2 -->
  <line x1="94" y1="52" x2="146" y2="98" stroke="#4051b5" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 有向边：3 → 2 -->
  <line x1="226" y1="52" x2="174" y2="98" stroke="#4051b5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 顶点 1 -->
  <circle cx="80" cy="40" r="18" fill="#e3edfd" stroke="#4051b5" stroke-width="2"/>
  <text x="80" y="46" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a237e">1</text>

  <!-- 顶点 3 -->
  <circle cx="240" cy="40" r="18" fill="#e3edfd" stroke="#4051b5" stroke-width="2"/>
  <text x="240" y="46" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a237e">3</text>

  <!-- 顶点 2 -->
  <circle cx="160" cy="112" r="18" fill="#e3edfd" stroke="#4051b5" stroke-width="2"/>
  <text x="160" y="118" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a237e">2</text>
</svg>
