<svg xmlns="http://www.w3.org/2000/svg" width="640" height="106" viewBox="0 0 640 106" role="img" aria-labelledby="title">
  <title id="title">MIME 在非 ASCII 数据与 7 位 ASCII 数据之间转换</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#4051b5"/>
    </marker>
    <style>
      text { fill: #1a237e; text-anchor: middle; font-family: "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 24px; font-weight: 600; }
      .data { font-size: 20px; }
      .node { fill: #eaf0ff; stroke: #4051b5; stroke-width: 1.5; }
      .converter { fill: #e9f6f1; stroke: #2f9070; }
      .converter-label { fill: #237354; }
      .exchange { fill: none; stroke: #4051b5; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="640" height="106" fill="#fff"/>

  <rect class="node" x="18" y="28" width="96" height="50" rx="7"/>
  <rect class="node converter" x="258" y="28" width="124" height="50" rx="7"/>
  <rect class="node" x="526" y="28" width="96" height="50" rx="7"/>
  <text x="66" y="61">用户</text>
  <text class="converter-label" x="320" y="61">MIME</text>
  <text x="574" y="61">SMTP</text>

  <path class="exchange" d="M 122 53 H 250"/>
  <path class="exchange" d="M 390 53 H 518"/>
  <text class="data" x="186" y="42">非 ASCII 码</text>
  <text class="data" x="454" y="42">7 位 ASCII 码</text>
</svg>
