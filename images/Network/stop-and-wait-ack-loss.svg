<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc">
  <title id="title">确认丢失与重复帧处理</title>
  <desc id="desc">帧 0 到达并交付后，ACK 0 在返回途中丢失。发送方超时后重传帧 0；接收方识别重复，不再交付，只再次返回 ACK 0。发送方收到确认后发送帧 1。时间从上向下。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4051b5"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f9070"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#c07f1e"/></marker>
    <style>
      text { fill: #1a237e; font-family: "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 26px; text-anchor: middle; dominant-baseline: middle; }
      .heading { font-size: 28px; font-weight: 600; }
      .frame { font-size: 27px; font-weight: 600; }
      .green { fill: #2f9070; }
      .amber { fill: #8a5a10; }
      .red { fill: #c5474c; }
      .axis { fill: none; stroke: #4051b5; stroke-width: 2; stroke-dasharray: 7 6; opacity: .5; }
      .data { fill: none; stroke: #4051b5; stroke-width: 3; marker-end: url(#arrow-blue); }
      .ack { fill: none; stroke: #2f9070; stroke-width: 3; marker-end: url(#arrow-green); }
      .retry { fill: none; stroke: #c07f1e; stroke-width: 3; marker-end: url(#arrow-amber); }
      .bracket { fill: none; stroke: #c07f1e; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1000" height="780" fill="#ffffff"/>
  <rect x="156" y="26" width="208" height="58" rx="10" fill="#eaf0ff" stroke="#4051b5" stroke-width="2"/>
  <rect x="546" y="26" width="208" height="58" rx="10" fill="#e9f6f1" stroke="#2f9070" stroke-width="2"/>
  <text x="260" y="56" class="heading">发送方 A</text>
  <text x="650" y="56" class="heading" style="fill:#2f9070">接收方 B</text>
  <path class="axis" d="M 260 100 V 740"/>
  <path class="axis" d="M 650 100 V 740"/>
  <text x="66" y="112">时间</text>
  <path class="data" d="M 66 143 V 732"/>
  <path class="bracket" d="M 220 135 H 207 V 343 H 220"/>
  <text x="156" y="251" class="amber">计时</text>
  <path class="data" d="M 260 135 L 650 190"/>
  <text x="455" y="142" class="frame">帧 0</text>
  <text x="824" y="188" class="green">交付帧 0</text>
  <text x="824" y="224">等待帧 1</text>
  <path d="M 650 250 L 450 290" fill="none" stroke="#c5474c" stroke-width="3" stroke-dasharray="9 5"/>
  <text x="559" y="248" class="frame" style="fill:#c5474c">ACK 0</text>
  <path d="M 439 279 L 461 301 M 461 279 L 439 301" fill="none" stroke="#c5474c" stroke-width="4" stroke-linecap="round"/>
  <text x="407" y="323" class="red">丢失</text>
  <rect x="212" y="343" width="96" height="44" rx="10" fill="#fdf4e6" stroke="#c07f1e" stroke-width="2"/>
  <text x="260" y="365" class="frame" style="fill:#c07f1e">超时</text>
  <path class="retry" d="M 260 405 L 650 460"/>
  <text x="455" y="406" class="frame" style="fill:#c07f1e">帧 0（重传）</text>
  <text x="824" y="454" class="amber">重复帧</text>
  <text x="824" y="490" class="amber">不再交付</text>
  <path class="ack" d="M 650 530 L 260 585"/>
  <text x="455" y="532" class="frame" style="fill:#2f9070">ACK 0</text>
  <text x="824" y="534" class="green">再次确认</text>
  <path class="data" d="M 260 640 L 650 695"/>
  <text x="455" y="642" class="frame">帧 1</text>
  <text x="824" y="694" class="green">交付帧 1</text>
</svg>
