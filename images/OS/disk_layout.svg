<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 505" width="1160" height="505" role="img" aria-labelledby="title desc" font-family="Times New Roman, Times, Liberation Serif, Noto Serif, serif">
<title id="title">传统 MBR 分区方案下的磁盘与文件系统布局</title>
<desc id="desc">整个磁盘起始处为包含分区表的主引导记录 MBR，随后是多个磁盘分区。将其中的分区 2 放大，依次显示引导块、超级块、空闲空间管理、i 节点、根目录、文件和目录。</desc>
