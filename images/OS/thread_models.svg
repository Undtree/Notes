<text x="62" y="175" text-anchor="middle" font-size="17" font-weight="600" fill="#283593">U1</text>
<circle cx="137" cy="169" r="23" fill="#e0e7ff" stroke="#4051b5" stroke-width="2"/>
<text x="137" y="175" text-anchor="middle" font-size="17" font-weight="600" fill="#283593">U2</text>
