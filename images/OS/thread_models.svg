<path d="M 212 192 C 212 236 212 290 212 327" fill="none" stroke="#60718e" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 287 192 C 287 236 287 290 287 327" fill="none" stroke="#60718e" stroke-width="1.8" marker-end="url(#arrow)"/>
