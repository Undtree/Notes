<text x="175" y="78" text-anchor="middle" font-size="16" font-weight="400" fill="#455a64">One-to-one</text>
<text x="175" y="126" text-anchor="middle" font-size="17" font-weight="600" fill="#4051b5">用户空间 · 用户线程 U</text>
<text x="175" y="399" text-anchor="middle" font-size="17" font-weight="600" fill="#00796b">内核空间 · 内核线程 K</text>
