<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" role="img" aria-labelledby="title desc" font-family="Source Han Sans SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="title">三种多线程映射模型</title>
<desc id="desc">每个面板展示同一进程的线程。上方 U 表示用户线程，下方 K 表示内核线程，水平虚线分隔用户空间与内核空间。一对一为四个用户线程对应四个内核线程；多对多为四个用户线程动态映射到两个内核线程，斜虚线表示可能的映射而非同时执行；多对一为四个用户线程共享一个内核线程。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60718e"/></marker></defs>
<rect width="1120" height="520" fill="#fff"/>
