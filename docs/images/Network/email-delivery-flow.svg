<svg xmlns="http://www.w3.org/2000/svg" width="640" height="192" viewBox="0 0 640 192" role="img" aria-labelledby="title">
  <title id="title">电子邮件的投递与读取</title>
  <defs>
    <marker id="delivery-arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#4051b5"/>
    </marker>
    <marker id="read-arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2f9070"/>
    </marker>
    <style>
      text { fill: #1a237e; text-anchor: middle; font-family: "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 23px; font-weight: 600; }
      .protocol { font-size: 20px; }
      rect { stroke-width: 1.5; }
      .delivery rect { fill: #eaf0ff; stroke: #4051b5; }
      .read rect { fill: #e9f6f1; stroke: #2f9070; }
      .read text { fill: #237354; }
      .delivery path, .read path { fill: none; stroke-width: 2; }
      .delivery path { stroke: #4051b5; marker-end: url(#delivery-arrow); }
      .read path { stroke: #2f9070; marker-end: url(#read-arrow); }
    </style>
  </defs>
  <rect width="640" height="192" fill="#fff"/>

  <g class="delivery">
    <rect x="18" y="20" width="156" height="50" rx="7"/>
    <rect x="242" y="20" width="156" height="50" rx="7"/>
    <rect x="466" y="20" width="156" height="50" rx="7"/>
    <text x="96" y="53">发信用户代理</text>
    <text x="320" y="53">发信服务器</text>
    <text x="544" y="53">收信服务器</text>

    <path d="M 180 45 H 236"/>
    <path d="M 404 45 H 460"/>
    <path d="M 544 76 V 116"/>
    <text class="protocol" x="208" y="34">SMTP</text>
    <text class="protocol" x="432" y="34">SMTP</text>
  </g>

  <g class="read">
    <rect x="466" y="122" width="156" height="50" rx="7"/>
    <rect x="18" y="122" width="156" height="50" rx="7"/>
    <text x="544" y="155">邮箱</text>
    <text x="96" y="155">收信用户代理</text>

    <path d="M 460 147 H 180"/>
    <text class="protocol" x="320" y="136">POP3 / IMAP</text>
  </g>
</svg>
