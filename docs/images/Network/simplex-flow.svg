<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc">
  <title id="title">理想单工传输的收发流程</title>
  <desc id="desc">发送方循环取分组、封装成帧和发送；接收方循环接收帧、解封装和交付分组。双方独立持续处理，无需确认反馈。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4051b5"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f9070"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#c07f1e"/></marker>
    <style>
      text { fill: #1a237e; font-family: "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 26px; text-anchor: middle; dominant-baseline: middle; }
      .heading { font-size: 28px; font-weight: 600; }
      .frame { font-size: 27px; font-weight: 600; }
      .green { fill: #2f9070; }
      .amber { fill: #8a5a10; }
      .red { fill: #c5474c; }
      .axis { fill: none; stroke: #4051b5; stroke-width: 2; stroke-dasharray: 7 6; opacity: .5; }
      .data { fill: none; stroke: #4051b5; stroke-width: 3; marker-end: url(#arrow-blue); }
      .ack { fill: none; stroke: #2f9070; stroke-width: 3; marker-end: url(#arrow-green); }
      .retry { fill: none; stroke: #c07f1e; stroke-width: 3; marker-end: url(#arrow-amber); }
      .bracket { fill: none; stroke: #c07f1e; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1000" height="370" fill="#ffffff"/>
  <text x="110" y="83" class="heading" style="fill:#4051b5">发送方 A</text>
  <rect x="220" y="52" width="180" height="62" rx="10" fill="#eaf0ff" stroke="#4051b5" stroke-width="2"/>
  <text x="310" y="83" class="frame" style="fill:#4051b5">取分组</text>
  <rect x="470" y="52" width="180" height="62" rx="10" fill="#eaf0ff" stroke="#4051b5" stroke-width="2"/>
  <text x="560" y="83" class="frame" style="fill:#4051b5">封装成帧</text>
  <rect x="720" y="52" width="180" height="62" rx="10" fill="#eaf0ff" stroke="#4051b5" stroke-width="2"/>
  <text x="810" y="83" class="frame" style="fill:#4051b5">发送</text>
  <path class="data" d="M 406 83 H 462"/>
  <path class="data" d="M 656 83 H 712"/>
  <path class="data" d="M 907 83 H 948 V 160 H 310 V 121"/>
  <text x="110" y="263" class="heading" style="fill:#2f9070">接收方 B</text>
  <rect x="220" y="232" width="180" height="62" rx="10" fill="#e9f6f1" stroke="#2f9070" stroke-width="2"/>
  <text x="310" y="263" class="frame" style="fill:#2f9070">接收帧</text>
  <rect x="470" y="232" width="180" height="62" rx="10" fill="#e9f6f1" stroke="#2f9070" stroke-width="2"/>
  <text x="560" y="263" class="frame" style="fill:#2f9070">解封装</text>
  <rect x="720" y="232" width="180" height="62" rx="10" fill="#e9f6f1" stroke="#2f9070" stroke-width="2"/>
  <text x="810" y="263" class="frame" style="fill:#2f9070">交付分组</text>
  <path class="ack" d="M 406 263 H 462"/>
  <path class="ack" d="M 656 263 H 712"/>
  <path class="ack" d="M 907 263 H 948 V 340 H 310 V 301"/>
</svg>
