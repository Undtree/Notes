<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 368" width="1160" height="368" role="img" aria-labelledby="title desc" font-family="Source Han Sans SC, Noto Sans SC, Microsoft YaHei, sans-serif">
  <title id="title">成组链接法的空闲盘块号栈与索引块</title>
  <desc id="desc">每组以四个块号示意，位置从上到下为 0、1、2、3，块号倒序排列。内存栈依次保存 300、203、202、201，位置 0 是栈底，300 号块用作索引块。块 300 保存计数 4，以及 400、303、302、301 四个块号，位置 0 的 400 号块保存后续一组信息。分配顺序为 201、202、203、300，分配 300 前先将它的内容读入内存栈。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4051b5"/>
    </marker>
  </defs>
  <rect width="1160" height="368" fill="#fff"/>
  <text x="580" y="38" text-anchor="middle" font-size="23" font-weight="600" fill="#24364b">成组链接法</text>
  <text x="206" y="88" text-anchor="middle" font-size="20" font-weight="600" fill="#24364b">内存中的空闲盘块号栈</text>
  <text x="607" y="88" text-anchor="middle" font-size="20" font-weight="600" fill="#24364b">磁盘块 300 的内容</text>
  <text x="993" y="88" text-anchor="middle" font-size="20" font-weight="600" fill="#24364b">磁盘块 400</text>
  <rect x="76" y="108" width="260" height="240" rx="6" fill="#f5f7fb" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="76" y="108" width="260" height="48" rx="6" fill="#eef1ff" stroke="#4051b5" stroke-width="1.5"/>
  <rect x="76" y="156" width="260" height="48" fill="#e8f7f3" stroke="#00897b" stroke-width="1.5"/>
  <path d="M 76 252 H 336 M 76 300 H 336" fill="none" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="206" y="139" text-anchor="middle" font-size="19" fill="#4051b5">当前计数 = 4</text>
  <text x="206" y="187" text-anchor="middle" font-size="21" fill="#00897b">300</text>
  <text x="206" y="235" text-anchor="middle" font-size="21" fill="#24364b">203</text>
  <text x="206" y="283" text-anchor="middle" font-size="21" fill="#24364b">202</text>
  <text x="206" y="331" text-anchor="middle" font-size="21" fill="#24364b">201</text>
  <g text-anchor="end" font-size="20" fill="#65748b">
    <text x="60" y="187">0</text>
    <text x="60" y="235">1</text>
    <text x="60" y="283">2</text>
    <text x="60" y="331">3</text>
  </g>
  <rect x="477" y="108" width="260" height="240" rx="6" fill="#f5f7fb" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="477" y="108" width="260" height="48" rx="6" fill="#eef1ff" stroke="#4051b5" stroke-width="1.5"/>
  <rect x="477" y="156" width="260" height="48" fill="#e8f7f3" stroke="#00897b" stroke-width="1.5"/>
  <path d="M 477 252 H 737 M 477 300 H 737" fill="none" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="607" y="139" text-anchor="middle" font-size="19" fill="#4051b5">下一组计数 = 4</text>
  <text x="607" y="187" text-anchor="middle" font-size="21" fill="#00897b">400</text>
  <text x="607" y="235" text-anchor="middle" font-size="21" fill="#24364b">303</text>
  <text x="607" y="283" text-anchor="middle" font-size="21" fill="#24364b">302</text>
  <text x="607" y="331" text-anchor="middle" font-size="21" fill="#24364b">301</text>
  <g text-anchor="end" font-size="20" fill="#65748b">
    <text x="461" y="187">0</text>
    <text x="461" y="235">1</text>
    <text x="461" y="283">2</text>
    <text x="461" y="331">3</text>
  </g>
  <rect x="877" y="108" width="232" height="240" rx="6" fill="#f5f7fb" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="993" y="205" text-anchor="middle" font-size="20" fill="#24364b">后续一组的</text>
  <text x="993" y="240" text-anchor="middle" font-size="20" fill="#24364b">块号与计数</text>
  <text x="993" y="290" text-anchor="middle" font-size="27" fill="#65748b">⋮</text>
  <path d="M 336 180 H 402 V 132 H 471" fill="none" stroke="#4051b5" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 737 180 H 802 V 132 H 871" fill="none" stroke="#4051b5" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
