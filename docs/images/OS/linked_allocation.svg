<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" role="img" aria-label="链接分配的两种形式。隐式链接把下一块指针放在数据块内；显式链接把指针集中保存在全卷 FAT 中。示例文件依次占用物理块 2、8、5。" font-family="Source Han Sans SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<desc>链接分配的两种形式。隐式链接把下一块指针放在数据块内；显式链接把指针集中保存在全卷 FAT 中。示例文件依次占用物理块 2、8、5。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4051b5"/></marker></defs>
<rect width="1100" height="680" fill="#fff"/>
<rect x="24" y="20" width="1052" height="278" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="48" y="56" font-size="21" fill="#24364b" text-anchor="start" font-weight="600">隐式链接 · 指针保存在数据块内</text>
<rect x="48" y="103" width="196" height="124" rx="7" fill="#f5f7fb" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="146.0" y="132" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">目录项 · 文件 A</text>
<line x1="48" y1="147" x2="244" y2="147" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="146.0" y="176" font-size="18" fill="#24364b" text-anchor="middle" font-weight="400">首块：2    尾块：5</text>
<text x="425" y="96" font-size="18" fill="#65748b" text-anchor="middle" font-weight="400">物理块 2</text>
<rect x="330" y="113" width="190" height="118" rx="7" fill="#e8f7f3" stroke="#00897b" stroke-width="1.5"/>
<rect x="331" y="177" width="188" height="53" rx="0" fill="#eef1ff" stroke="#eef1ff" stroke-width="0"/>
<line x1="330" y1="177" x2="520" y2="177" stroke="#00897b" stroke-width="1.4"/>
<text x="425" y="153" font-size="21" fill="#00897b" text-anchor="middle" font-weight="600">逻辑块 0</text>
<text x="425" y="211" font-size="18" fill="#4051b5" text-anchor="middle" font-weight="400">下一块：8</text>
<text x="683" y="96" font-size="18" fill="#65748b" text-anchor="middle" font-weight="400">物理块 8</text>
<rect x="588" y="113" width="190" height="118" rx="7" fill="#e8f7f3" stroke="#00897b" stroke-width="1.5"/>
<rect x="589" y="177" width="188" height="53" rx="0" fill="#eef1ff" stroke="#eef1ff" stroke-width="0"/>
<line x1="588" y1="177" x2="778" y2="177" stroke="#00897b" stroke-width="1.4"/>
<text x="683" y="153" font-size="21" fill="#00897b" text-anchor="middle" font-weight="600">逻辑块 1</text>
<text x="683" y="211" font-size="18" fill="#4051b5" text-anchor="middle" font-weight="400">下一块：5</text>
<text x="941" y="96" font-size="18" fill="#65748b" text-anchor="middle" font-weight="400">物理块 5</text>
<rect x="846" y="113" width="190" height="118" rx="7" fill="#e8f7f3" stroke="#00897b" stroke-width="1.5"/>
<rect x="847" y="177" width="188" height="53" rx="0" fill="#eef1ff" stroke="#eef1ff" stroke-width="0"/>
<line x1="846" y1="177" x2="1036" y2="177" stroke="#00897b" stroke-width="1.4"/>
<text x="941" y="153" font-size="21" fill="#00897b" text-anchor="middle" font-weight="600">逻辑块 2</text>
<text x="941" y="211" font-size="18" fill="#4051b5" text-anchor="middle" font-weight="400">下一块：EOF</text>
<path d="M 244 145 H 326" fill="none" stroke="#4051b5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 520 204 H 553 V 145 H 584" fill="none" stroke="#4051b5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 778 204 H 811 V 145 H 842" fill="none" stroke="#4051b5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="24" y="320" width="1052" height="338" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="48" y="357" font-size="21" fill="#24364b" text-anchor="start" font-weight="600">显式链接 · 指针集中保存在 FAT 中</text>
<rect x="48" y="413" width="196" height="109" rx="7" fill="#f5f7fb" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="146.0" y="442" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">目录项 · 文件 A</text>
<line x1="48" y1="457" x2="244" y2="457" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="146.0" y="486" font-size="18" fill="#24364b" text-anchor="middle" font-weight="400">首块：2</text>
<text x="471" y="397" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">FAT（全卷共享）</text>
<rect x="338" y="413" width="266" height="195" rx="7" fill="#eef1ff" stroke="#4051b5" stroke-width="1.5"/>
<line x1="462" y1="413" x2="462" y2="608" stroke="#4051b5" stroke-width="1.4"/>
<line x1="338" y1="458" x2="604" y2="458" stroke="#4051b5" stroke-width="1.4"/>
<text x="400" y="442" font-size="18" fill="#24364b" text-anchor="middle" font-weight="600">物理块号</text>
<text x="533" y="442" font-size="18" fill="#24364b" text-anchor="middle" font-weight="600">下一块</text>
<text x="400" y="490" font-size="21" fill="#24364b" text-anchor="middle" font-weight="400">2</text>
<text x="533" y="490" font-size="21" fill="#4051b5" text-anchor="middle" font-weight="600">8</text>
<line x1="338" y1="508" x2="604" y2="508" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="400" y="540" font-size="21" fill="#24364b" text-anchor="middle" font-weight="400">5</text>
<text x="533" y="540" font-size="21" fill="#4051b5" text-anchor="middle" font-weight="600">EOF</text>
<line x1="338" y1="558" x2="604" y2="558" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="400" y="590" font-size="21" fill="#24364b" text-anchor="middle" font-weight="400">8</text>
<text x="533" y="590" font-size="21" fill="#4051b5" text-anchor="middle" font-weight="600">5</text>
<path d="M 244 476 H 334" fill="none" stroke="#4051b5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="898" y="397" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">磁盘中的数据块</text>
<rect x="772" y="413" width="252" height="52" rx="7" fill="#e8f7f3" stroke="#00897b" stroke-width="1.5"/>
<text x="898" y="446" font-size="19" fill="#00897b" text-anchor="middle" font-weight="600">物理块 2  ·  逻辑块 0</text>
<rect x="772" y="483" width="252" height="52" rx="7" fill="#e8f7f3" stroke="#00897b" stroke-width="1.5"/>
<text x="898" y="516" font-size="19" fill="#00897b" text-anchor="middle" font-weight="600">物理块 5  ·  逻辑块 2</text>
<rect x="772" y="553" width="252" height="52" rx="7" fill="#e8f7f3" stroke="#00897b" stroke-width="1.5"/>
<text x="898" y="586" font-size="19" fill="#00897b" text-anchor="middle" font-weight="600">物理块 8  ·  逻辑块 1</text>
<path d="M 604 583 H 680 V 509 H 768" fill="none" stroke="#4051b5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="689" y="476" font-size="16" fill="#4051b5" text-anchor="start" font-weight="400">读块 5</text>
<text x="48" y="564" font-size="17" fill="#65748b" text-anchor="start" font-weight="400">查链次序</text>
<text x="48" y="597" font-size="19" fill="#4051b5" text-anchor="start" font-weight="600">2 → 8 → 5 → EOF</text>
</svg>
