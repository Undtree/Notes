<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 580" width="1160" height="580" role="img" aria-labelledby="title desc" font-family="Times New Roman, Times, Liberation Serif, Noto Serif, serif">
<title id="title">软链接：保存目标路径，再按路径查找</title>
<desc id="desc">在已有 A、B 两个硬链接的基础上增加软链接 C。A、B 仍指向 inode 40，目标文件的硬链接计数仍为 2。C 指向独立的符号链接 inode 73，其链接内容为路径 /docs/A。访问 C 时读取这段路径，再回到目录中查找 A，最后定位 inode 40 和文件数据。虚线表示路径解析，不是指向目标 inode 的直接指针。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4051b5"/></marker></defs>
<rect width="1160" height="580" fill="#fff"/>
<text x="580" y="43" text-anchor="middle" font-size="23" fill="#24364b" font-weight="600"><tspan font-family="Source Han Sans SC, Noto Sans SC, Microsoft YaHei, sans-serif">软链接：保存目标路径，再按路径查找</tspan></text>
<text x="180" y="141" text-anchor="middle" font-size="22" fill="#24364b" font-weight="600"><tspan font-family="Source Han Sans SC, Noto Sans SC, Microsoft YaHei, sans-serif">目录</tspan> /docs</text>
<rect x="40" y="165" width="280" height="265" rx="7" fill="#f5f7fb" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="180" y1="165" x2="180" y2="430" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="40" y1="220" x2="320" y2="220" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="110" y="200" text-anchor="middle" font-size="20" fill="#24364b" font-weight="600"><tspan font-family="Source Han Sans SC, Noto Sans SC, Microsoft YaHei, sans-serif">文件名</tspan></text>
<text x="250" y="200" text-anchor="middle" font-size="20" fill="#24364b" font-weight="600">inode <tspan font-family="Source Han Sans SC, Noto Sans SC, Microsoft YaHei, sans-serif">号</tspan></text>
<text x="110" y="263" text-anchor="middle" font-size="26" fill="#4051b5" font-weight="600">A</text>
<text x="250" y="263" text-anchor="middle" font-size="25" fill="#4051b5" font-weight="400">40</text>
<line x1="40" y1="290" x2="320" y2="290" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="110" y="333" text-anchor="middle" font-size="26" fill="#4051b5" font-weight="600">B</text>
<text x="250" y="333" text-anchor="middle" font-size="25" fill="#4051b5" font-weight="400">40</text>
<line x1="40" y1="360" x2="320" y2="360" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="110" y="403" text-anchor="middle" font-size="26" fill="#4051b5" font-weight="600">C</text>
<text x="250" y="403" text-anchor="middle" font-size="25" fill="#4051b5" font-weight="400">73</text>
<rect x="480" y="165" width="260" height="205" rx="7" fill="#eef1ff" stroke="#4051b5" stroke-width="1.5"/>
<text x="610" y="200" text-anchor="middle" font-size="24" fill="#4051b5" font-weight="600">inode 40</text>
<line x1="480" y1="217" x2="740" y2="217" stroke="#4051b5" stroke-width="1.4"/>
<text x="610" y="252" text-anchor="middle" font-size="21" fill="#24364b" font-weight="400"><tspan font-family="Source Han Sans SC, Noto Sans SC, Microsoft YaHei, sans-serif">类型：普通文件</tspan></text>
<text x="610" y="289" text-anchor="middle" font-size="21" fill="#4051b5" font-weight="600"><tspan font-family="Source Han Sans SC, Noto Sans SC, Microsoft YaHei, sans-serif">硬链接计数：</tspan>2</text>
<text x="610" y="337" text-anchor="middle" font-size="21" fill="#24364b" font-weight="400"><tspan font-family="Source Han Sans SC, Noto Sans SC, Microsoft YaHei, sans-serif">数据块地址</tspan></text>
<rect x="850" y="165" width="270" height="205" rx="7" fill="#e8f7f3" stroke="#00897b" stroke-width="1.5"/>
<text x="985" y="200" text-anchor="middle" font-size="22" fill="#00897b" font-weight="600"><tspan font-family="Source Han Sans SC, Noto Sans SC, Microsoft YaHei, sans-serif">文件数据块</tspan></text>
<line x1="850" y1="217" x2="1120" y2="217" stroke="#00897b" stroke-width="1.4"/>
<text x="985" y="251" text-anchor="middle" font-size="21" fill="#00897b" font-weight="400"><tspan font-family="Source Han Sans SC, Noto Sans SC, Microsoft YaHei, sans-serif">数据块</tspan> 0</text>
<line x1="850" y1="268" x2="1120" y2="268" stroke="#a8d6cc" stroke-width="1.4"/>
<text x="985" y="298" text-anchor="middle" font-size="21" fill="#00897b" font-weight="400"><tspan font-family="Source Han Sans SC, Noto Sans SC, Microsoft YaHei, sans-serif">数据块</tspan> 1</text>
<line x1="850" y1="315" x2="1120" y2="315" stroke="#a8d6cc" stroke-width="1.4"/>
<text x="985" y="345" text-anchor="middle" font-size="21" fill="#00897b" font-weight="400"><tspan font-family="Source Han Sans SC, Noto Sans SC, Microsoft YaHei, sans-serif">数据块</tspan> 2</text>
<rect x="480" y="410" width="260" height="150" rx="7" fill="#eef1ff" stroke="#4051b5" stroke-width="1.5"/>
<text x="610" y="445" text-anchor="middle" font-size="24" fill="#4051b5" font-weight="600">inode 73</text>
<line x1="480" y1="462" x2="740" y2="462" stroke="#4051b5" stroke-width="1.4"/>
<text x="610" y="497" text-anchor="middle" font-size="21" fill="#24364b" font-weight="400"><tspan font-family="Source Han Sans SC, Noto Sans SC, Microsoft YaHei, sans-serif">类型：符号链接</tspan></text>
<text x="610" y="534" text-anchor="middle" font-size="21" fill="#4051b5" font-weight="600"><tspan font-family="Source Han Sans SC, Noto Sans SC, Microsoft YaHei, sans-serif">硬链接计数：</tspan>1</text>
<rect x="850" y="425" width="270" height="110" rx="7" fill="#f5f7fb" stroke="#4051b5" stroke-width="1.5"/>
<text x="985" y="460" text-anchor="middle" font-size="20" fill="#24364b" font-weight="600"><tspan font-family="Source Han Sans SC, Noto Sans SC, Microsoft YaHei, sans-serif">链接内容（路径字符串）</tspan></text>
<text x="985" y="503" text-anchor="middle" font-size="26" fill="#4051b5" font-weight="400">/docs/A</text>
<path d="M 320 255 H 390 V 250 H 478" fill="none" stroke="#4051b5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 320 325 H 420 V 310 H 478" fill="none" stroke="#4051b5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 320 395 H 390 V 485 H 478" fill="none" stroke="#4051b5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 740 337 H 790 V 268 H 848" fill="none" stroke="#4051b5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 740 485 H 848" fill="none" stroke="#4051b5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 1120 480 H 1145 V 92 H 15 V 255 H 38" fill="none" stroke="#4051b5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="760" y="79" text-anchor="middle" font-size="19" fill="#4051b5" font-weight="400"><tspan font-family="Source Han Sans SC, Noto Sans SC, Microsoft YaHei, sans-serif">按路径</tspan> /docs/A <tspan font-family="Source Han Sans SC, Noto Sans SC, Microsoft YaHei, sans-serif">重新查找目录</tspan></text>
</svg>
