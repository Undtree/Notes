<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 410" width="1020" height="410" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif">
  <title>管道通信示意图</title>
  <desc>写进程通过 fd[1] 把数据写入内核中的管道环形缓冲区，读进程通过 fd[0] 按写入顺序读出；缓冲区满时写进程阻塞，空时读进程阻塞。</desc>

  <defs>
    <marker id="pipe-arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4051b5"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1020" height="410" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="510" y="46" text-anchor="middle" font-size="21" font-weight="700" fill="#1a237e">管道通信</text>
  <text x="510" y="74" text-anchor="middle" font-size="15" fill="#455a64">单向（半双工）的字节流通道，本质是内核中一块固定大小的环形缓冲区</text>

  <!-- ============ 写进程 ============ -->
  <rect x="40" y="110" width="230" height="240" rx="12" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
  <text x="155" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#1a237e">写进程（生产者）</text>
  <line x1="52" y1="161" x2="258" y2="161" stroke="#9aa7bd" stroke-width="1" stroke-dasharray="5 4"/>

  <rect x="54" y="180" width="202" height="42" rx="6" fill="#f5f7fb" stroke="#1f1f1f" stroke-width="1.2"/>
  <text x="155" y="207" text-anchor="middle" font-size="15" fill="#1a237e" font-family="Consolas, Source Han Sans SC, monospace">write(fd[1], buf, n)</text>

  <text x="155" y="246" text-anchor="middle" font-size="13" fill="#4051b5">写端 fd[1]</text>
  <text x="155" y="272" text-anchor="middle" font-size="14" fill="#455a64">写入的数据按写入顺序</text>
  <text x="155" y="294" text-anchor="middle" font-size="14" fill="#455a64">排入缓冲区；写满则阻塞</text>

  <!-- ============ 写入 → 管道 ============ -->
  <line x1="272" y1="226" x2="373" y2="226" stroke="#4051b5" stroke-width="3.5" marker-end="url(#pipe-arrow)"/>
  <text x="322" y="209" text-anchor="middle" font-size="12" font-weight="700" fill="#4051b5">write 原语</text>
  <text x="322" y="248" text-anchor="middle" font-size="12" fill="#455a64">写入数据</text>

  <!-- ============ 内核中的管道 ============ -->
  <rect x="375" y="110" width="270" height="240" rx="12" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
  <text x="510" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#1a237e">内核中的管道</text>
  <line x1="387" y1="161" x2="633" y2="161" stroke="#9aa7bd" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- 缓冲区状态说明 -->
  <text x="440" y="186" text-anchor="middle" font-size="13" fill="#4051b5">已写入未读取</text>
  <text x="552" y="186" text-anchor="middle" font-size="13" fill="#455a64">空闲区</text>

  <!-- 环形缓冲区（线性展开为 8 个单元） -->
  <rect x="398" y="198" width="84" height="56" fill="#dfe7fb" stroke="#4051b5" stroke-width="2"/>
  <rect x="482" y="198" width="140" height="56" fill="#ffffff" stroke="#a9bbdd" stroke-width="1.5"/>
  <g stroke="#a9bbdd" stroke-width="1">
    <line x1="426" y1="198" x2="426" y2="254"/>
    <line x1="454" y1="198" x2="454" y2="254"/>
    <line x1="510" y1="198" x2="510" y2="254"/>
    <line x1="538" y1="198" x2="538" y2="254"/>
    <line x1="566" y1="198" x2="566" y2="254"/>
    <line x1="594" y1="198" x2="594" y2="254"/>
  </g>

  <!-- 读指针 / 写指针 -->
  <line x1="412" y1="276" x2="412" y2="258" stroke="#4051b5" stroke-width="2.5" marker-end="url(#pipe-arrow)"/>
  <line x1="496" y1="276" x2="496" y2="258" stroke="#4051b5" stroke-width="2.5" marker-end="url(#pipe-arrow)"/>
  <text x="412" y="294" text-anchor="middle" font-size="13" fill="#4051b5">读指针</text>
  <text x="496" y="294" text-anchor="middle" font-size="13" fill="#4051b5">写指针</text>

  <text x="510" y="318" text-anchor="middle" font-size="13" fill="#455a64">读写指针到达末尾后回绕到头部</text>
  <text x="510" y="338" text-anchor="middle" font-size="13" fill="#455a64">读出次序 = 写入次序（FIFO）</text>

  <!-- ============ 管道 → 读出 ============ -->
  <line x1="647" y1="226" x2="748" y2="226" stroke="#4051b5" stroke-width="3.5" marker-end="url(#pipe-arrow)"/>
  <text x="697" y="209" text-anchor="middle" font-size="12" font-weight="700" fill="#4051b5">read 原语</text>
  <text x="697" y="248" text-anchor="middle" font-size="12" fill="#455a64">读出数据</text>

  <!-- ============ 读进程 ============ -->
  <rect x="750" y="110" width="230" height="240" rx="12" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
  <text x="865" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#1a237e">读进程（消费者）</text>
  <line x1="762" y1="161" x2="968" y2="161" stroke="#9aa7bd" stroke-width="1" stroke-dasharray="5 4"/>

  <rect x="764" y="180" width="202" height="42" rx="6" fill="#f5f7fb" stroke="#1f1f1f" stroke-width="1.2"/>
  <text x="865" y="207" text-anchor="middle" font-size="15" fill="#1a237e" font-family="Consolas, Source Han Sans SC, monospace">read(fd[0], buf, n)</text>

  <text x="865" y="246" text-anchor="middle" font-size="13" fill="#4051b5">读端 fd[0]</text>
  <text x="865" y="272" text-anchor="middle" font-size="14" fill="#455a64">从缓冲区读出最早写入</text>
  <text x="865" y="294" text-anchor="middle" font-size="14" fill="#455a64">的数据；读空则阻塞</text>

  <!-- 底部注释 -->
  <text x="510" y="395" text-anchor="middle" font-size="14" fill="#455a64">读写两端由两个进程各自持有，常配合 fork 用于父子、亲属进程之间的数据交换</text>
</svg>
