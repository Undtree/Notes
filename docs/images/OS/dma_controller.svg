<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 580" width="1280" height="580" role="img" aria-labelledby="dma-title dma-desc" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif">
  <title id="dma-title">DMA 控制器的组成</title>
  <desc id="dma-desc">CPU、内存和 DMA 控制器连接系统总线，CPU 通过总线向 DMA 控制器发送命令。DMA 控制器包括数据寄存器 DR、内存地址寄存器 MAR、数据计数器 DC、命令／状态寄存器 CR、I/O 控制逻辑和多个块设备接口。MAR 标识内存中的传输起始位置，DC 对应图中 count 标记的传输数量。</desc>
  <defs>
    <marker id="dma-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4051b5"/>
    </marker>
  </defs>
  <rect width="1280" height="580" fill="#ffffff"/>

  <rect x="580" y="65" width="675" height="410" rx="12" fill="#ffffff" stroke="#4051b5" stroke-width="2" stroke-dasharray="7 6"/>
  <g fill="#1a237e" text-anchor="middle" font-weight="700">
    <text x="917.5" y="38" font-size="27">DMA 控制器</text>
    <text x="112.5" y="100" font-size="25">CPU</text>
    <text x="380" y="100" font-size="25">内存</text>
    <text x="720" y="103" font-size="23">主机—控制器接口</text>
    <text x="1080" y="103" font-size="23">控制器—块设备接口</text>
  </g>

  <g stroke="#4051b5" stroke-width="2" fill="#f5f7fb">
    <rect x="35" y="120" width="155" height="355" rx="10"/>
    <rect x="285" y="120" width="190" height="355" rx="10" fill="#ffffff"/>
    <rect x="630" y="145" width="175" height="55" rx="8"/>
    <rect x="630" y="224" width="175" height="55" rx="8"/>
    <rect x="630" y="303" width="175" height="55" rx="8"/>
    <rect x="630" y="382" width="175" height="55" rx="8"/>
    <rect x="875" y="145" width="130" height="292" rx="10"/>
    <rect x="1060" y="145" width="145" height="110" rx="10"/>
    <rect x="1060" y="327" width="145" height="110" rx="10"/>
  </g>

  <rect x="385" y="180" width="65" height="160" fill="#eaf0ff" stroke="#4051b5" stroke-width="1.5"/>
  <g stroke="#9aa7bd" stroke-width="1.2">
    <path d="M 385 220 H 450 M 385 260 H 450 M 385 300 H 450"/>
    <path d="M 355 180 H 385 M 355 340 H 385"/>
  </g>

  <g fill="#1a237e" text-anchor="middle" font-size="25" font-weight="700">
    <text x="717.5" y="181">DR</text>
    <text x="717.5" y="260">MAR</text>
    <text x="717.5" y="339">DC</text>
    <text x="717.5" y="418">CR</text>
    <text x="940" y="267">I/O</text>
    <text x="940" y="303">控制</text>
    <text x="940" y="339">逻辑</text>
  </g>
  <g fill="#1a237e" text-anchor="middle" font-size="23">
    <text x="1132.5" y="192">块设备</text>
    <text x="1132.5" y="226">接口 1</text>
    <text x="1132.5" y="374">块设备</text>
    <text x="1132.5" y="408">接口 n</text>
  </g>
  <g fill="#455a64">
    <circle cx="1132.5" cy="279" r="2.5"/>
    <circle cx="1132.5" cy="291" r="2.5"/>
    <circle cx="1132.5" cy="303" r="2.5"/>
  </g>

  <g fill="none" stroke="#4051b5" stroke-width="2" marker-end="url(#dma-arrow)">
    <path d="M 630 251.5 L 450 180"/>
    <path d="M 630 330.5 L 385 260"/>
    <path d="M 365 180 V 340" marker-start="url(#dma-arrow)"/>
    <path d="M 205 525 H 275"/>
  </g>
  <g fill="none" stroke="#4051b5" stroke-width="2.2" stroke-linejoin="round">
    <path d="M 112.5 475 V 550 H 940 V 475"/>
    <path d="M 380 475 V 550"/>
  </g>
  <g fill="#4051b5" text-anchor="middle" font-size="23">
    <text x="320" y="268">count</text>
    <text x="240" y="510">命令</text>
    <text x="545" y="532">系统总线</text>
  </g>
</svg>
