<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" role="img" aria-labelledby="title desc" font-family="Times New Roman, Times, Liberation Serif, Noto Serif, serif">
<title id="title">4M×4 位 DRAM 芯片的逻辑结构</title>
<desc id="desc">4M×4 位 DRAM 采用 2048×2048×4 位存储阵列。A0 至 A10 分时送入行、列地址缓冲器；MUX 在行地址与刷新计数器之间选择。行译码器选行，列译码器配合读出放大器与 I/O 门选列，四根数据线 D1 至 D4 连接数据输入、输出缓冲器。RAS、CAS、WE、OE 均为低电平有效。</desc>
