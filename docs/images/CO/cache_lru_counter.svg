<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="832" viewBox="0 0 1440 832" role="img" aria-labelledby="title desc" font-family="Times New Roman, Times, Liberation Serif, Noto Serif, serif">
<title id="title">LRU 计数器从空开始的更新过程（四路组）</title><desc id="desc">四路组从空开始，依次调入 A、B、C、D。每调入一块，新行计数值置 0，原有各行加 1，故调入 D 后计数值自上而下为 0、1、2、3，从近到远是 D C B A。访问 C 命中，C 置 0，比它新的 D 加 1，次序变为 C D B A。再访问 E 缺失且组已满，替换计数值为 3 的 A；E 置 0，其余各行加 1，次序变为 E C D B。各行按计数值自上而下排列，浅蓝底、红框标出本次调入或被访问的块，虚线框表示空闲行。</desc>
<!-- 与 storage.md 中「LRU 的计数器实现」一致；四路组计数器为 ⌈log2 r⌉ = 2 位，0 表示最近访问，r − 1 = 3 表示最久未访问。 -->
