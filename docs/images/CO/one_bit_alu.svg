<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc" font-family="Times New Roman, Times, Liberation Serif, Noto Serif, serif">
<title id="title">一位 ALU：与、或、加法</title>
<desc id="desc">A、B 分别进入与门、或门和全加器；Cin 只进入全加器。两位 ALUop 控制 MUX：00 选与，01 选或，10 选加法，11 未使用。全加器独立输出 Cout。</desc>
<!-- 复习指导 图 2.8；位编号统一从 0 开始，寄存器名称与正文一致。 -->
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4051b5"/></marker>
<marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d62728"/></marker>
</defs>
<rect width="1100" height="560" fill="#ffffff"/>
<text x="550" y="42" text-anchor="middle" font-size="21" fill="#1a237e" font-weight="700"><tspan font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif">一位</tspan> ALU<tspan font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif">：并行计算，再选择一路结果</tspan></text>
