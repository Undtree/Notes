<text x="485.0" y="415.0" text-anchor="middle" font-size="20" fill="#1a237e" font-weight="700">FA</text>
<text x="485.0" y="442.0" text-anchor="middle" font-size="16" fill="#1a237e"><tspan font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif">一位全加器</tspan></text>
<path d="M 750 105 L 880 130 V 450 L 750 475 Z" fill="#eaf0ff" stroke="#4051b5" stroke-width="2" stroke-linejoin="round"/>
<text x="830.6" y="296.0" text-anchor="middle" font-size="19" fill="#1a237e" font-weight="700">MUX</text>
<text x="762" y="166" text-anchor="start" font-size="16" fill="#1a237e">00</text>
<text x="762" y="276" text-anchor="start" font-size="16" fill="#1a237e">01</text>
<text x="762" y="421" text-anchor="start" font-size="16" fill="#1a237e">10</text>
