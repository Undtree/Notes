<text x="1030" y="297" text-anchor="middle" font-size="22" fill="#1a237e" font-weight="700">F</text>
<text x="810" y="521" text-anchor="middle" font-size="17" fill="#1a237e">11<tspan font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif">：未使用</tspan></text>
</svg>
