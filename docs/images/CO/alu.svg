<path d="M 140 185 H 340" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="115" y="191" text-anchor="middle" font-size="22" fill="#1a237e">A</text>
<path d="M 224 191 L 236 179" fill="none" stroke="#4051b5" stroke-width="2" stroke-linejoin="round"/>
<text x="230" y="175" text-anchor="middle" font-size="15" fill="#1a237e">n</text>
<path d="M 140 345 H 340" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="115" y="351" text-anchor="middle" font-size="22" fill="#1a237e">B</text>
<path d="M 224 351 L 236 339" fill="none" stroke="#4051b5" stroke-width="2" stroke-linejoin="round"/>
<text x="230" y="335" text-anchor="middle" font-size="15" fill="#1a237e">n</text>
