<path d="M 540 325 H 670" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="700" y="331" text-anchor="middle" font-size="18" fill="#1a237e">CF</text>
<path d="M 540 265 H 825" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
