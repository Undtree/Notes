<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc" font-family="Times New Roman, Times, Liberation Serif, Noto Serif, serif">
<title id="title">算术逻辑单元的基本结构</title>
<desc id="desc">ALU 使用专用凹口轮廓。输入为两个 n 位操作数 A、B，进位输入 Cin 与 k 位操作控制 ALUop；输出为 n 位结果 F、Cout 和 ZF、OF、SF、CF。</desc>
<!-- 复习指导 图 2.7；位编号统一从 0 开始，寄存器名称与正文一致。 -->
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4051b5"/></marker>
<marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d62728"/></marker>
</defs>
<rect width="960" height="490" fill="#ffffff"/>
<text x="480" y="40" text-anchor="middle" font-size="21" fill="#1a237e" font-weight="700"><tspan font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif">算术逻辑单元（</tspan>ALU<tspan font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif">）的基本结构</tspan></text>
