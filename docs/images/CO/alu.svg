<text x="350" y="65" text-anchor="middle" font-size="18" fill="#1a237e">ALUop</text>
<path d="M 384 105 L 396 93" fill="none" stroke="#4051b5" stroke-width="2" stroke-linejoin="round"/>
<text x="402" y="103" text-anchor="start" font-size="15" fill="#1a237e">k</text>
<path d="M 480 70 V 161.5" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="500" y="65" text-anchor="middle" font-size="18" fill="#1a237e">C<tspan font-size="12.6" dy="4">in</tspan></text>
<path d="M 540 205 H 670" fill="none" stroke="#4051b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
