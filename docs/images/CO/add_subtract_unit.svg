<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="570" viewBox="0 0 1180 570" role="img" aria-labelledby="title desc" font-family="Times New Roman, Times, Liberation Serif, Noto Serif, serif">
<title id="title">统一的加减运算电路</title>
<desc id="desc">Y 分成直接输入与经 n 位反相器输入两路，由 Sub 选择后成为 Y′；Sub 同时作为最低位进位。Sub=0 加法，Sub=1 减法；CF=Cout 异或 Sub。</desc>
<!-- 复习指导 图 2.9；位编号统一从 0 开始，寄存器名称与正文一致。 -->
