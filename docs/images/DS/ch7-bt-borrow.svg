<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4051b5"/>
    </marker>
  </defs>

  <!-- 白色背景 -->
  <rect x="0" y="0" width="1120" height="440" fill="#ffffff"/>

  <!-- 小标题 -->
  <text x="240" y="38" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#1a237e">删除前（删除终端结点中的 15）</text>
  <text x="800" y="38" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#1a237e">删除后（父子借位：父 30 下移、兄 40 上移）</text>

  <!-- 删除前 -->

  <!-- 边：根 [30] - 左结点 [15] -->
  <line x1="240" y1="154" x2="100" y2="296" stroke="#1f1f1f" stroke-width="2"/>
  <!-- 边：根 [30] - 中间结点 [40 45] -->
  <line x1="240" y1="154" x2="240" y2="296" stroke="#1f1f1f" stroke-width="2"/>
  <!-- 边：根 [30] - 右结点 [50 60] -->
  <line x1="240" y1="154" x2="390" y2="296" stroke="#1f1f1f" stroke-width="2"/>

  <!-- 结点：根 [30] -->
  <rect x="208" y="106" width="64" height="48" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
  <text x="240" y="130" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#4051b5">30</text>
  <!-- 结点：左结点 [15]（待删关键字 15 标红） -->
  <rect x="68" y="296" width="64" height="48" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
  <text x="100" y="320" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#d62728">15</text>
  <!-- 结点：兄弟结点 [40 45]（40 将上移） -->
  <rect x="188" y="296" width="104" height="48" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
  <line x1="240" y1="296" x2="240" y2="344" stroke="#1f1f1f" stroke-width="1.5"/>
  <text x="214" y="320" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#4051b5">40</text>
  <text x="266" y="320" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" fill="#1a237e">45</text>
  <!-- 结点：右结点 [50 60] -->
  <rect x="338" y="296" width="104" height="48" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
  <line x1="390" y1="296" x2="390" y2="344" stroke="#1f1f1f" stroke-width="1.5"/>
  <text x="364" y="320" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" fill="#1a237e">50</text>
  <text x="416" y="320" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" fill="#1a237e">60</text>

  <!-- 删除后 -->

  <!-- 边：根 [40] - 左结点 [30] -->
  <line x1="800" y1="154" x2="660" y2="296" stroke="#1f1f1f" stroke-width="2"/>
  <!-- 边：根 [40] - 中间结点 [45] -->
  <line x1="800" y1="154" x2="800" y2="296" stroke="#1f1f1f" stroke-width="2"/>
  <!-- 边：根 [40] - 右结点 [50 60] -->
  <line x1="800" y1="154" x2="950" y2="296" stroke="#1f1f1f" stroke-width="2"/>

  <!-- 结点：根 [40]（兄 40 上移至根） -->
  <rect x="768" y="106" width="64" height="48" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
  <text x="800" y="130" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#d62728">40</text>
  <!-- 结点：左结点 [30]（父 30 下移至左结点） -->
  <rect x="628" y="296" width="64" height="48" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
  <text x="660" y="320" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#d62728">30</text>
  <!-- 结点：中间结点 [45] -->
  <rect x="768" y="296" width="64" height="48" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
  <text x="800" y="320" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" fill="#1a237e">45</text>
  <!-- 结点：右结点 [50 60] -->
  <rect x="898" y="296" width="104" height="48" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
  <line x1="950" y1="296" x2="950" y2="344" stroke="#1f1f1f" stroke-width="1.5"/>
  <text x="924" y="320" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" fill="#1a237e">50</text>
  <text x="976" y="320" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" fill="#1a237e">60</text>

  <!-- 删除前后分隔箭头 -->
  <line x1="548" y1="210" x2="640" y2="210" stroke="#4051b5" stroke-width="3.5" marker-end="url(#arrow)"/>
</svg>
