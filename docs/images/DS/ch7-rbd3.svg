<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4051b5"/>
    </marker>
  </defs>

  <!-- 白色背景 -->
  <rect x="0" y="0" width="1120" height="440" fill="#ffffff"/>

  <!-- 小标题 -->
  <text x="240" y="38" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#1a237e">调整前（w 黑，w.rc 红）</text>
  <text x="800" y="38" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#1a237e">调整后（w.rc 染黑，左旋 x.p，调整结束）</text>

  <!-- 调整前 -->

  <!-- 边：x.p - x -->
  <line x1="240" y1="200" x2="150" y2="295" stroke="#1f1f1f" stroke-width="2"/>
  <!-- 边：x.p - w -->
  <line x1="240" y1="200" x2="360" y2="295" stroke="#1f1f1f" stroke-width="2"/>
  <!-- 边：w - w.lc -->
  <line x1="360" y1="295" x2="300" y2="390" stroke="#1f1f1f" stroke-width="2"/>
  <!-- 边：w - w.rc -->
  <line x1="360" y1="295" x2="420" y2="390" stroke="#1f1f1f" stroke-width="2"/>
  <!-- 边：w - x.p -->
  <line x1="840" y1="115" x2="760" y2="210" stroke="#1f1f1f" stroke-width="2"/>
  <!-- 边：w - w.rc -->
  <line x1="840" y1="115" x2="940" y2="210" stroke="#1f1f1f" stroke-width="2"/>
  <!-- 边：x.p - x -->
  <line x1="760" y1="210" x2="680" y2="305" stroke="#1f1f1f" stroke-width="2"/>
  <!-- 边：x.p - w.lc -->
  <line x1="760" y1="210" x2="820" y2="305" stroke="#1f1f1f" stroke-width="2"/>

  <!-- 结点 -->
  <!-- 结点 x.p（x 与 w 的父亲（红）） -->
  <circle cx="240" cy="200" r="26" fill="#ffffff" stroke="#d62728" stroke-width="3.5"/>
  <text x="240" y="200" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#1a237e">x.p</text>
  <!-- 结点 x（双黑结点） -->
  <circle cx="150" cy="295" r="33" fill="#ffffff" stroke="#1f1f1f" stroke-width="3.5"/>
  <circle cx="150" cy="295" r="22" fill="#1f1f1f"/>
  <text x="150" y="295" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">x</text>
  <!-- 结点 w（x 的兄弟（黑）） -->
  <circle cx="360" cy="295" r="26" fill="#1f1f1f" stroke="#1f1f1f" stroke-width="2"/>
  <text x="360" y="295" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">w</text>
  <!-- 结点 w.lc（w 的左孩子（黑）） -->
  <circle cx="300" cy="390" r="26" fill="#1f1f1f" stroke="#1f1f1f" stroke-width="2"/>
  <text x="300" y="390" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">w.lc</text>
  <!-- 结点 w.rc（w 的右孩子（红）） -->
  <circle cx="420" cy="390" r="26" fill="#ffffff" stroke="#d62728" stroke-width="3.5"/>
  <text x="420" y="390" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#1a237e">w.rc</text>
  <!-- 结点 w（与 x.p 交换颜色） -->
  <circle cx="840" cy="115" r="26" fill="#ffffff" stroke="#d62728" stroke-width="3.5"/>
  <text x="840" y="115" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#1a237e">w</text>
  <!-- 结点 x.p（与 w 交换颜色） -->
  <circle cx="760" cy="210" r="26" fill="#1f1f1f" stroke="#1f1f1f" stroke-width="2"/>
  <text x="760" y="210" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">x.p</text>
  <!-- 结点 w.rc（染黑） -->
  <circle cx="940" cy="210" r="26" fill="#1f1f1f" stroke="#1f1f1f" stroke-width="2"/>
  <text x="940" y="210" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">w.rc</text>
  <!-- 结点 NIL（x 恢复单黑） -->
  <rect x="671" y="296" width="18" height="18" fill="#1f1f1f"/>
  <!-- 结点 w.lc（原 w.lc 成为 x.p 的右孩子） -->
  <circle cx="820" cy="305" r="26" fill="#1f1f1f" stroke="#1f1f1f" stroke-width="2"/>
  <text x="820" y="305" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">w.lc</text>

  <!-- 调整前后分隔箭头 -->
  <line x1="548" y1="210" x2="640" y2="210" stroke="#4051b5" stroke-width="3.5" marker-end="url(#arrow)"/>
</svg>
