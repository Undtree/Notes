<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4051b5"/>
    </marker>
  </defs>

  <!-- 白色背景 -->
  <rect x="0" y="0" width="1120" height="440" fill="#ffffff"/>

  <!-- 小标题 -->
  <text x="240" y="38" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#1a237e">删除前（删除 15，兄弟 [40] 仅含 1 个关键字）</text>
  <text x="800" y="38" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#1a237e">删除后（空结点、兄弟与父 30 合并为 [30 40]）</text>

  <!-- 删除前 -->

  <!-- 边：根 [30 50] - 左结点 [15] -->
  <line x1="240" y1="154" x2="100" y2="296" stroke="#1f1f1f" stroke-width="2"/>
  <!-- 边：根 [30 50] - 中间结点 [40] -->
  <line x1="240" y1="154" x2="240" y2="296" stroke="#1f1f1f" stroke-width="2"/>
  <!-- 边：根 [30 50] - 右结点 [60 70] -->
  <line x1="240" y1="154" x2="390" y2="296" stroke="#1f1f1f" stroke-width="2"/>

  <!-- 结点：根 [30 50]（30 将下移） -->
  <rect x="188" y="106" width="104" height="48" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
  <line x1="240" y1="106" x2="240" y2="154" stroke="#1f1f1f" stroke-width="1.5"/>
  <text x="214" y="130" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#4051b5">30</text>
  <text x="266" y="130" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" fill="#1a237e">50</text>
  <!-- 结点：左结点 [15]（待删关键字 15 标红） -->
  <rect x="68" y="296" width="64" height="48" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
  <text x="100" y="320" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#d62728">15</text>
  <!-- 结点：兄弟结点 [40]（仅 1 个关键字，无法借位） -->
  <rect x="208" y="296" width="64" height="48" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
  <text x="240" y="320" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" fill="#1a237e">40</text>
  <!-- 结点：右结点 [60 70] -->
  <rect x="338" y="296" width="104" height="48" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
  <line x1="390" y1="296" x2="390" y2="344" stroke="#1f1f1f" stroke-width="1.5"/>
  <text x="364" y="320" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" fill="#1a237e">60</text>
  <text x="416" y="320" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" fill="#1a237e">70</text>

  <!-- 删除后 -->

  <!-- 边：根 [50] - 左结点 [30 40] -->
  <line x1="800" y1="154" x2="680" y2="296" stroke="#1f1f1f" stroke-width="2"/>
  <!-- 边：根 [50] - 右结点 [60 70] -->
  <line x1="800" y1="154" x2="950" y2="296" stroke="#1f1f1f" stroke-width="2"/>

  <!-- 结点：根 [50] -->
  <rect x="768" y="106" width="64" height="48" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
  <text x="800" y="130" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" fill="#1a237e">50</text>
  <!-- 结点：合并后的左结点 [30 40]（父 30 下移与 40 合并） -->
  <rect x="628" y="296" width="104" height="48" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
  <line x1="680" y1="296" x2="680" y2="344" stroke="#1f1f1f" stroke-width="1.5"/>
  <text x="654" y="320" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#d62728">30</text>
  <text x="706" y="320" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" fill="#1a237e">40</text>
  <!-- 结点：右结点 [60 70] -->
  <rect x="898" y="296" width="104" height="48" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
  <line x1="950" y1="296" x2="950" y2="344" stroke="#1f1f1f" stroke-width="1.5"/>
  <text x="924" y="320" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" fill="#1a237e">60</text>
  <text x="976" y="320" dominant-baseline="central" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans SC, Source Han Sans CN, Microsoft YaHei, sans-serif" font-size="16" fill="#1a237e">70</text>

  <!-- 删除前后分隔箭头 -->
  <line x1="548" y1="210" x2="640" y2="210" stroke="#4051b5" stroke-width="3.5" marker-end="url(#arrow)"/>
</svg>
