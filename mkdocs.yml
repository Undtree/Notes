site_name: Undertree's 小站
site_url: https://undtree.github.io/Notes/
repo_name: Undtree/Notes
repo_url: https://github.com/Undtree/Notes/

nav:
  - 主页: index.md

  # - 数学:
  #   - 数值分析: 数理内容/NA.md
  # - 外语:
  #   - 日语(日本語): Language/JPN.md

  - 计算机科学:
    - CS/index.md
    # - 计算机网络: Network.md
    # - 操作系统: CS/OS.md
    # - 计算机体系结构: CS/CA.md
    # - 面向对象程序设计(in C++): CS/OOP.md
    - 数据结构与算法分析: CS/DS.md
    - 计算理论: CS/TOC.md
    - 编译原理: CS/CP.md
    - 数据库系统: CS/DBS.md
    - 软件工程:
      - CS/SE/index.md
    - 多媒体技术: CS/multimedia.md

  - Web 相关:
    - Web/index.md
    - 计算机网络:
      - Web/cn/index.md

  # - 安全:
    # - 密码学: Security/Crypto.md
    # - 软件安全: Security/SwSec.md
    # - 人工智能安全: 
    #   - Security/AISec/index.md

  - 人工智能:
    - AI/index.md
    - 自然语言处理导论:
      - AI/NLP/index.md
    - 深度合成与电子取证:
      - AI/深度合成与电子取证/index.md

  - 数理内容:
    - sciences/index.md
    - 大学物理: sciences/Phy.md

theme:
    name: material
    # favicon: assets/logo/
    language: 'zh'
    features:
      - toc.follow
      - content.code.copy
      - search.share
      - search.suggest
      - search.highlight
      - navigation.tracking
      - navigation.tabs
      - navigation.indexes
      - navigation.top
    font: false
    custom_dir: overrides
    palette:
      - media: "(prefers-color-scheme)"
        scheme: default
        primary: indigo
        accent: indigo
        toggle:
          icon: material/brightness-auto
          name: 切换至日间模式

      - media: "(prefers-color-scheme: light)"
        scheme: default
        primary: indigo
        accent: indigo
        toggle:
          icon: material/brightness-7
          name: 切换至夜间模式

      - media: "(prefers-color-scheme: dark)"
        scheme: slate
        primary: indigo
        accent: indigo
        toggle:
          icon: material/brightness-4
          name: 切换至跟随系统
    icon: 
      logo: material/notebook-outline

plugins:
    - statistics
    - changelog
    - search
    - mermaid2

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 4
  - meta
  - def_list
  - attr_list
  - md_in_html
  - admonition
  - markdown_cjk_spacing.cjk_spacing
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      # make exceptions to highlighting of code:
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  
extra_javascript:
  - javascripts/mathjax.js
# - javascripts/toc_scroll_fix.js
  - https://cdn.tonycrane.cc/utils/katex.min.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/contrib/auto-render.min.js

extra_css:
# - https://fonts.googleapis.com/css2?family=Noto+Serif+SC&display=swap
# - https://cdn.tonycrane.cc/utils/katex.min.css
# - https://cdn.tonycrane.cc/jbmono/jetbrainsmono.css
# - https://cdn.tonycrane.cc/lxgw/lxgwscreen.css
# - https://cdn.jsdelivr.net/npm/jetbrains-mono@1.0.6/css/jetbrains-mono.min.css 
  - https://gcore.jsdelivr.net/npm/@fontsource-variable/noto-serif@5.3.0/index.css
  - https://gcore.jsdelivr.net/npm/@fontsource-variable/noto-serif@5.3.0/wght-italic.css 
  - https://gcore.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css
# - https://gcore.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css
  - stylesheets/extra.css
  - stylesheets/card.css
  - stylesheets/404.css
